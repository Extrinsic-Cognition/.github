name: Idea or request
description: Ask for a feature, a change, a design or copy update, or a piece of work.
type: Feature
labels: ["needs-triage"]
body:
  - type: textarea
    id: need
    attributes:
      label: What is needed?
      description: The problem it solves or the change you want, in plain words.
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who is it for, and why now?
  - type: textarea
    id: done
    attributes:
      label: How will we know it is done?
      placeholder: "- Players can ...\n- The page shows ..."
  - type: textarea
    id: extra
    attributes:
      label: Links, mockups, examples
